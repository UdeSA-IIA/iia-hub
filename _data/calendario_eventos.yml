# Días puntuales del Calendario Académico 2026 para pintar en la vista de calendario
# completo de calendario.html. Es la misma info de _data/calendario.yml, pero
# desglosada día por día (en rangos) para poder colorearla.
#
# categoria: clave que matchea con una clase .cat-<categoria> en el CSS y con
# "categorias" de acá abajo (color + etiqueta de la referencia).

anio: 2026

categorias:
  - clave: hito
    color: brand
    etiqueta: "Hito del semestre"
  - clave: administrativo
    color: amber
    etiqueta: "Trámite administrativo"
  - clave: examenes
    color: danger
    etiqueta: "Exámenes"
  - clave: receso
    color: accent
    etiqueta: "Receso / vacaciones"
  - clave: feriado
    color: coral
    etiqueta: "Feriado nacional"

eventos:
  - titulo: "Acto de apertura"
    categoria: hito
    rangos:
      - { inicio: "2026-02-27", fin: "2026-02-27" }

  - titulo: "Inicio de clases - 1er semestre"
    categoria: hito
    rangos:
      - { inicio: "2026-03-02", fin: "2026-03-02" }

  - titulo: "Último día para agregar o abandonar materias - 1er semestre"
    categoria: administrativo
    rangos:
